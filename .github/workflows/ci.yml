name: Sonny CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r modelo/requirements.txt

      - name: Run App Logic Tests (Node.js)
        run: |
          cd app
          npm ci
          npm test

      - name: Run Model TS Parity Tests (TypeScript)
        run: |
          cd modelo
          npm test

      - name: Run Model Quality Gate Tests (Python)
        run: |
          cd modelo
          python -m unittest discover -s tests -v

